apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-service
  namespace: production
  labels:
    app: worker-service
    version: "1.4.2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-service
  template:
    metadata:
      labels:
        app: worker-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: worker-service
          image: ghcr.io/org/worker-service:1.4.2
          ports:
            - containerPort: 8080
          env:
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: worker-secrets
                  key: internal-api-key
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: worker-secrets
                  key: redis-url
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
