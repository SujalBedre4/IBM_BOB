name: CI — AutoRelease Guard

on:
  pull_request:
    branches: [main, "release/*"]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, worker-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (api-gateway)
        if: matrix.service == 'api-gateway'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/api-gateway/package-lock.json

      - name: Install & Test (api-gateway)
        if: matrix.service == 'api-gateway'
        working-directory: services/api-gateway
        run: |
          npm ci
          npm test -- --ci --coverage

      - name: Setup Python (worker-service)
        if: matrix.service == 'worker-service'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install & Test (worker-service)
        if: matrix.service == 'worker-service'
        working-directory: services/worker-service
        run: |
          pip install -r requirements.txt
          pytest tests/ -v --tb=short

  docker-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/api-gateway/Dockerfile
          format: sarif
          output-file: reports/hadolint-api.sarif
          no-fail: true
      - name: Run Hadolint (worker)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/worker-service/Dockerfile
          format: sarif
          output-file: reports/hadolint-worker.sarif
          no-fail: true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit
        working-directory: services/api-gateway
        run: npm audit --audit-level=high
        continue-on-error: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        working-directory: services/worker-service
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format json -o /tmp/pip-audit.json || true
          cat /tmp/pip-audit.json

  k8s-validate:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeval
        run: |
          wget -q https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/
      - name: Validate K8s manifests
        run: kubeval --strict k8s/*.yaml

  bob-shell-preflight:
    name: Bob Shell — Non-Interactive Release Pre-Flight
    runs-on: ubuntu-latest
    # This job demonstrates IBM Bob 2.0 Shell Automation:
    # it invokes Bob non-interactively as a CI gate that evaluates the
    # AutoRelease Guard pipeline and blocks the release on NO-GO verdicts.
    needs: [build-and-test, docker-lint, dependency-audit, k8s-validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (verdict parser)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Make preflight scripts executable
        run: chmod +x scripts/bob-preflight.sh scripts/run-release-preflight.sh

      - name: Run Bob non-interactive pre-flight
        # bob --non-interactive "run release pre-flight" is the canonical invocation.
        # When the Bob CLI is unavailable (e.g. not yet installed in this runner),
        # the script falls back to simulation mode — evaluating the reports already
        # committed to the repo. In a real deployment, install Bob first:
        #   npm install -g @ibm/bob-cli   (or follow IBM Bob 2.0 install docs)
        env:
          BOB_CLI: bob
          RELEASE_VERSION: ${{ github.ref_name }}
          BASE_BRANCH: main
          BOB_TIMEOUT: "600"
        run: ./scripts/run-release-preflight.sh --version "${{ github.ref_name }}" --base-branch main

      - name: Upload release-readiness report as CI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autorelease-guard-reports-${{ github.sha }}
          path: |
            reports/release-readiness.json
            reports/security.sarif.json
            reports/infra-check.json
            reports/coverage-gaps.json
            artifacts/RELEASE_NOTES.md
            artifacts/ROLLBACK_RUNBOOK.md
            artifacts/DEPLOY_CHECKLIST.md
          retention-days: 30

      - name: Comment verdict on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let verdict = 'UNKNOWN';
            let summary = '';
            try {
              const data = JSON.parse(fs.readFileSync('reports/release-readiness.json', 'utf8'));
              verdict = data.verdict || 'UNKNOWN';
              const fs_data = data.findings_summary || {};
              const blocked = verdict === 'NO-GO';
              summary = [
                `## AutoRelease Guard — ${blocked ? '❌ NO-GO' : '✅ GO'}`,
                '',
                `| Track | Status | Findings |`,
                `|-------|--------|----------|`,
                `| Security | ${data.pipeline_run?.sec_auditor?.blocked ? '❌ BLOCKED' : '✅ PASS'} | ${fs_data.critical || 0} critical, ${fs_data.high || 0} high, ${fs_data.medium || 0} medium |`,
                `| Infrastructure | ${data.pipeline_run?.infra_validator?.blocked ? '❌ BLOCKED' : '✅ PASS'} | ${fs_data.infra_violations || 0} violations |`,
                `| Test Coverage | ${data.pipeline_run?.test_synthesizer?.blocked ? '❌ BLOCKED' : '✅ PASS'} | ${fs_data.uncovered_high_risk_symbols || 0} gaps, ${fs_data.tests_generated || 0} tests synthesized |`,
                '',
                blocked
                  ? '> ⛔ This release is **blocked**. See `reports/release-readiness.json` and `artifacts/DEPLOY_CHECKLIST.md` for required remediation steps.'
                  : '> ✅ All checks passed. Proceed through the deployment checklist in `artifacts/DEPLOY_CHECKLIST.md`.',
                '',
                `*Generated by AutoRelease Guard v1.0.0 — commit \`${{ github.sha }}\`*`
              ].join('\n');
            } catch (e) {
              summary = `## AutoRelease Guard\n\n⚠️ Could not parse release-readiness.json: ${e.message}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });
